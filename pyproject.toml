[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-template-ops"
version = "0.1.0"
description = "Agentic AI Software Template & Model Update Tool for RHDH"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.21.0",
    "requests>=2.31.0",
    "click>=8.1.7",
    "tabulate>=0.9.0",
    "pydantic>=2.6.0",
    "packaging>=24.0",
]

[project.scripts]
agentic-template-ops = "agentic_template_ops.cli:cli"

[tool.setuptools.packages.find]
include = ["agentic_template_ops*"]
